<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Revisor de ortografía</title>
<link rel="stylesheet" href="panel.css">
<script src="vendor/pdf.min.js"></script>
<script type="module" src="panel.js"></script>
</head>
<body>
<section id="caja" class="caja leyendo" aria-live="polite">
  <header>
    <button id="plegar" class="titulo" type="button" aria-expanded="true">
      <span id="titulo">Revisando ortografía…</span>
    </button>
    <button id="cerrar" class="x" type="button" title="Ocultar. Se vuelve a mostrar con el ícono de la extensión o con Alt+Mayús+R" aria-label="Ocultar">×</button>
  </header>
  <div id="cuerpo">
    <ul id="lista"></ul>
    <footer id="pie" hidden>
      <button id="original" type="button" hidden>Ver PDF original</button>
      <button id="igual" type="button" hidden>Revisar igual</button>
      <span class="nota">Revisado en esta computadora. No se envía nada.</span>
    </footer>
  </div>
</section>
</body>
</html>
