name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Las versiones de las acciones no son cosmetica: cada action declara
      # con que Node corre su propio codigo (`runs.using`), y eso es
      # independiente del `node-version` de abajo. checkout@v4, setup-node@v4
      # y deploy-pages@v4 declaran node20, que Actions ya no ejecuta: los
      # forzaba a node24 y anotaba la corrida. De v5 en adelante declaran
      # node24 y la anotacion desaparece.
      - name: Checkout
        uses: actions/checkout@v7

      # node-version es otra cosa: el Node con el que corren npm ci y los
      # scripts del repositorio. Node 20 salio de soporte en abril de 2026.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install repo dependencies
        run: npm ci

      # Corre antes de armar el sitio: si un documento de dominio cita una
      # norma, un articulo o un identificador que no existe, no se publica.
      # No verifica que lo que dicen sea cierto —eso se hace leyendo el
      # motor— pero una cita inventada no llega a produccion.
      #
      # honorio/ no esta en el runner, asi que los identificadores del
      # motor salen como no verificables y no hacen fallar. Lo que si
      # falla aca son las citas de normas y articulos, que es la clase de
      # error que costo mas cara.
      - name: Verificar citas de la documentacion de dominio
        run: npm run verificar-docs

      # El motor de Escribiente: conversion a Markdown, rechazo del PDF sin
      # OCR, anonimizacion y rangos de paginas. Corre aca por el mismo motivo
      # que el de arriba: la herramienta de la que salio estuvo meses
      # publicada perdiendo el contenido de las resoluciones de una carilla y
      # convirtiendo montos en [DNI], sin que nada lo notara.
      - name: Verificar el motor de Escribiente
        run: npm run verificar-escribiente

      # Las dos series de valores que muestra uma-uhom.html. Se editan a mano
      # cada vez que sale un acto nuevo, y las tres formas en que un archivo
      # asi se rompe --vigencia repetida, serie que baja, acto anterior a la
      # vigencia-- dan las tres un numero plausible que nadie ve en el diff.
      - name: Verificar las series de UMA y UHOM
        run: npm run verificar-series

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p site

          # Lista explicita (allowlist), no blacklist: entra a produccion
          # solo lo que se nombra aca. Si sumas algo, enlazalo desde
          # index.html o no va a existir para nadie.
          cp index.html site/
          cp documentacion.html site/
          cp quien-soy.html site/
          cp uma-uhom.html site/
          cp -r assets site/
          cp -r calculadoras site/
          cp -r data site/
          cp -r asistente-honorarios-clasico site/
          cp -r "proyectos finalizados" "site/proyectos finalizados"

          # Escribiente: PWA estatica de vanilla JS, todo del lado del
          # navegador. La carpeta del repositorio ya es la raiz servible, asi
          # que se copia entera —incluido vendor/, que son pdf.js y pdf-lib
          # versionados adentro del repositorio a proposito: una herramienta
          # que promete que el documento no sale de la maquina no puede
          # cargar el codigo que lo lee desde un CDN de un tercero.
          cp -r escribiente site/escribiente

          # PDF-studio se rehizo entero y paso a llamarse Escribiente el
          # 17/8. La URL vieja estuvo publicada meses y sigue viva con un
          # aviso, que es la regla de la casa: retirar algo no puede ser
          # dejar un 404.
          cp -r redirects/pdf-studio site/PDF-studio

          # /honorio/ ya no sirve la app: Honorio vive en honorio.ar,
          # en su propio repositorio. Queda una pagina de redireccion para
          # que los enlaces viejos —los que ya andan dando vueltas— no
          # mueran en un 404.
          cp -r redirects/honorio site/honorio

          # calculadoras/honorarios.html se retiro el 7/8: su "grupo 4"
          # aplicaba la reduccion del art. 22 sobre la escala en vez de
          # sobre la base, o sea devolvia un numero mas alto que el
          # correcto. Se dio de baja en lugar de corregirse porque
          # Honorio ya la reemplaza. El archivo queda en el repositorio
          # como historia; lo que se publica en su URL es el aviso, para
          # que ningun enlace viejo muera en un 404 ni entregue un
          # numero equivocado.
          cp redirects/honorarios-retirada/index.html site/calculadoras/honorarios.html

      # docs/domain/ renderizado a HTML. Va despues del ensamblado
      # porque escribe dentro de site/.
      - name: Build domain docs
        run: npm run docs -- site/docs

      # Esta es composite: el node20 que anotaba Actions venia del
      # actions/upload-artifact que usa adentro, no de ella. Hasta v4 pinea
      # upload-artifact@v4 (node20); v5 pasa a v7 (node24).
      #
      # Desde v4 excluye del artefacto los archivos y carpetas que empiezan
      # con punto, salvo que se le pase include-hidden-files: true. Hoy no
      # se publica ninguno —el ensamblado de arriba es una allowlist y no
      # nombra ninguno—, pero si algun dia entra uno, va a faltar en el
      # sitio sin que nada falle.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v4 tambien declara node20; la anotacion que se leyo era la del job
      # de build y no lo nombraba, pero es el mismo caso.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
