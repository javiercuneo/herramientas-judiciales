name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install repo dependencies
        run: npm ci

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p site

          # Lista explicita (allowlist), no blacklist: entra a produccion
          # solo lo que se nombra aca. Si sumas algo, enlazalo desde
          # index.html o no va a existir para nadie.
          cp index.html site/
          cp documentacion.html site/
          cp -r assets site/
          cp -r calculadoras site/
          cp -r data site/
          cp -r asistente-honorarios-clasico site/
          cp -r "proyectos finalizados" "site/proyectos finalizados"

          # PDF-studio: PWA estatica de vanilla JS (client-side).
          # Se publica solo public/, que es la raiz servible.
          cp -r PDF-studio/public site/PDF-studio

          # /honorio/ ya no sirve la app: Honorio vive en honorio.ar,
          # en su propio repositorio. Queda una pagina de redireccion para
          # que los enlaces viejos —los que ya andan dando vueltas— no
          # mueran en un 404.
          cp -r redirects/honorio site/honorio

      # docs/domain/ renderizado a HTML. Va despues del ensamblado
      # porque escribe dentro de site/.
      - name: Build domain docs
        run: npm run docs -- site/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
