<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plazo al paso</title>
<meta name="description" content="Vencimiento, caducidad, mora y días entre fechas, en una pantalla angosta: la del panel lateral de la extensión.">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/comun.css">
<link rel="stylesheet" href="css/dias-propios.css">
<script src="../assets/tema.js"></script>
<style>
    /* ------------------------------------------------------------------
       La pantalla del panel lateral (27/10/2026).

       Existe porque el tablero entero, metido en un panel de 360 px, se
       veia chico y apretado, y el resultado quedaba abajo de todo: Javier
       no encontro la fecha. Esta pantalla es la respuesta primero y el
       formulario despues, y nada mas.

       Desde el 28/10 contesta las cuatro preguntas que salen de UNA fecha
       ---vencimiento, caducidad, mora y dias entre fechas---. La fecha se
       carga una vez y vale para las cuatro: es la idea del «tablero de
       plazos» de IDEAS.md, en chico.

       NO CALCULA NADA PROPIO. Cada resultado sale de js/plazos.js, el mismo
       motor de las calculadoras completas, con el mismo calendario y los
       mismos dias inhabiles propios (js/dias-propios.js: la lista es la del
       sitio, porque el marco de la extension no esta particionado ---visto
       el 28/10---). Lo que esta pantalla no pregunta ---la ampliacion por
       distancia, las notas del Libro de Asistencia--- no se supone: se manda
       a la calculadora completa.
       ------------------------------------------------------------------ */
    body { margin: 0; padding: 12px 14px 20px; font-size: 15px; }
    .hoy { color: var(--muted-fg); font-size: 13px; margin: 0 0 10px; }
    .hoy b { color: var(--fg); font-weight: 600; }

    .herramientas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
    .herramientas button {
        font: inherit; font-size: 13px; padding: 6px 2px;
        border: 1px solid var(--border); border-radius: 8px;
        background: var(--card); color: var(--fg); cursor: pointer;
    }
    .herramientas button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

    .respuesta {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius, 10px);
        padding: 14px;
        margin-bottom: 14px;
        min-height: 92px;
    }
    .respuesta .rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-fg); }
    .respuesta .fecha {
        font-family: var(--font-meter);
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
        margin: 2px 0 4px;
        color: var(--accent);
    }
    .respuesta p { font-size: 13px; color: var(--muted-fg); margin: 2px 0 0; }
    .respuesta .espera { font-size: 15px; margin: 0; }
    .respuesta .problema { font-size: 14px; color: var(--error); margin: 0; }
    .respuesta .dp-usados { font-size: 13px; }

    .tomado { font-size: 13px; color: var(--muted-fg); margin: -6px 0 12px; }
    .tomado:empty { display: none; }

    form { display: grid; gap: 12px; }
    label.campo, .campo { display: grid; gap: 4px; font-size: 13px; color: var(--muted-fg); }
    input[type=text] {
        font: inherit;
        font-size: 17px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
        width: 100%;
        box-sizing: border-box;
    }
    input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    input.invalido { border-color: var(--error); }
    .fila { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .fila input[type=text] { flex: 1; min-width: 0; }
    button.chico {
        font: inherit;
        font-size: 13px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--sunk);
        color: var(--fg);
        cursor: pointer;
    }
    button.chico:hover { border-color: var(--accent); }

    .modalidad { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .modalidad label { text-align: center; padding: 8px 4px; cursor: pointer; font-size: 14px; background: var(--card); color: var(--fg); }
    .modalidad input { position: absolute; opacity: 0; pointer-events: none; }
    .modalidad label:has(input:checked) { background: var(--accent); color: var(--on-accent); }
    .modalidad label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -3px; }

    .casilla { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--fg); }
    .casilla input { margin-top: 3px; }
    [hidden] { display: none !important; }

    .completo { font-size: 14px; margin: 14px 0 0; }
    a { color: var(--accent); }
    .propios { margin-top: 14px; }
    .nota { font-size: 12px; color: var(--faint); margin: 12px 0 0; line-height: 1.5; }
</style>
</head>
<body>

<p class="hoy" id="hoy">Cargando el calendario…</p>

<nav class="herramientas" aria-label="Qué calcular">
    <button type="button" data-herramienta="vencimiento" aria-pressed="true">Vence</button>
    <button type="button" data-herramienta="caducidad" aria-pressed="false">Caducidad</button>
    <button type="button" data-herramienta="mora" aria-pressed="false">Mora</button>
    <button type="button" data-herramienta="entre" aria-pressed="false">Entre fechas</button>
</nav>

<section class="respuesta" id="respuesta" aria-live="polite">
    <p class="espera">Cargá la fecha.</p>
</section>
<p class="tomado" id="tomado"></p>

<form id="form" autocomplete="off" novalidate>
    <div class="modalidad" role="radiogroup" aria-label="Cómo se notificó" data-solo="vencimiento">
        <label><input type="radio" name="modalidad" value="cedula" checked> Cédula</label>
        <label><input type="radio" name="modalidad" value="automatica"> Automática</label>
    </div>

    <label class="campo"><span id="rotulo-fecha">Notificada el</span>
        <span class="fila">
            <input type="text" id="fecha" inputmode="numeric" placeholder="dd/mm/aaaa" aria-describedby="rotulo-fecha">
            <button type="button" class="chico" data-hoy="fecha">Hoy</button>
        </span>
    </label>

    <label class="campo" data-solo="entre">Hasta el
        <span class="fila">
            <input type="text" id="hasta" inputmode="numeric" placeholder="dd/mm/aaaa">
            <button type="button" class="chico" data-hoy="hasta">Hoy</button>
        </span>
    </label>

    <label class="campo" data-solo="vencimiento">Plazo, en días hábiles
        <span class="fila">
            <input type="text" id="plazo" inputmode="numeric" placeholder="5">
            <button type="button" class="chico" data-poner="plazo" data-valor="3">3</button>
            <button type="button" class="chico" data-poner="plazo" data-valor="5">5</button>
            <button type="button" class="chico" data-poner="plazo" data-valor="10">10</button>
            <button type="button" class="chico" data-poner="plazo" data-valor="15">15</button>
        </span>
    </label>

    <label class="campo" data-solo="caducidad">Plazo del art. 310 CPCCN, en meses
        <span class="fila">
            <input type="text" id="meses" inputmode="numeric" placeholder="6">
            <button type="button" class="chico" data-poner="meses" data-valor="6">6</button>
            <button type="button" class="chico" data-poner="meses" data-valor="3">3</button>
            <button type="button" class="chico" data-poner="meses" data-valor="1">1</button>
        </span>
    </label>

    <label class="campo" data-solo="mora">Hasta que quede firme, en días hábiles
        <input type="text" id="firme" inputmode="numeric" value="10">
    </label>
    <label class="campo" data-solo="mora">Para pagar, en días corridos
        <input type="text" id="pago" inputmode="numeric" value="10">
    </label>

    <label class="casilla" data-solo="vencimiento" id="caja-horario">
        <input type="checkbox" id="fuera-de-horario">
        <span>La cédula se diligenció fuera del horario hábil (antes de las 7 o después de las 20)</span>
    </label>
    <label class="casilla" data-solo="vencimiento" id="caja-nota" hidden>
        <input type="checkbox" id="hubo-nota">
        <span>Se dejó nota en el Libro de Asistencia</span>
    </label>

    <label class="casilla" data-solo="entre"><input type="checkbox" id="solo-habiles"> <span>Sólo días hábiles</span></label>
    <label class="casilla" data-solo="entre"><input type="checkbox" id="incluir-inicio" checked> <span>Contar el día de inicio</span></label>
    <label class="casilla" data-solo="entre"><input type="checkbox" id="incluir-fin" checked> <span>Contar el día de fin</span></label>
</form>

<p class="completo"><a id="completo" href="vencimientos.html" target="_blank" rel="noopener">El cómputo completo, con el calendario</a></p>

<div class="propios" data-dias-propios></div>

<p class="nota" id="nota"></p>

<script src="js/calendario-judicial.js"></script>
<script src="js/plazos.js"></script>
<script src="js/dias-propios.js"></script>
<script>
'use strict';

// Los mismos anios que cargan las calculadoras: de 2021 al que viene.
var MIN_YEAR = 2021;
var MAX_YEAR = new Date().getFullYear() + 1;
var listo = false;
var herramienta = 'vencimiento';

var $ = function (id) { return document.getElementById(id); };

// Lo que cambia de una herramienta a otra: el rotulo de la fecha, la
// calculadora completa a la que se manda, y la nota de lo que no se pregunta.
var HERRAMIENTAS = {
    vencimiento: { fecha: 'Notificada el', pagina: 'vencimientos.html',
        nota: 'Sin ampliación por distancia: para eso, el cómputo completo.' },
    caducidad: { fecha: 'Último acto impulsor', pagina: 'caducidad.html',
        nota: 'Los meses se cuentan de fecha a fecha, y la feria se descuenta (art. 311 CPCCN).' },
    mora: { fecha: 'Notificación de la sentencia', pagina: 'mora.html',
        nota: 'Primero los días hábiles hasta que queda firme, después los corridos para pagar.' },
    entre: { fecha: 'Desde el', pagina: 'entre-fechas.html', nota: '' }
};

// --- Fechas ------------------------------------------------------------------
// Se acepta lo que se selecciona en el PJN: 14/10/2026, 14/1/2026, 14-10-2026,
// 14.10.2026. El anio con cuatro cifras: con dos, 26 puede ser 1926 o 2026, y
// eso no se adivina.
function leerFecha(texto) {
    var m = /^\s*(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})\s*$/.exec(texto || '');
    if (!m) return null;
    var d = +m[1], me = +m[2], a = +m[3];
    var f = new Date(a, me - 1, d);
    if (f.getFullYear() !== a || f.getMonth() !== me - 1 || f.getDate() !== d) return null;
    return { anio: a, mes: me, dia: d };
}

function entero(id, min) {
    var t = $(id).value.trim();
    var n = /^\d{1,3}$/.test(t) ? parseInt(t, 10) : NaN;
    $(id).classList.toggle('invalido', t !== '' && !(n >= min));
    return n >= min ? n : null;
}

function dos(n) { return (n < 10 ? '0' : '') + n; }
function ymd(f) { return f.anio + '-' + dos(f.mes) + '-' + dos(f.dia); }

// Con getters locales, como las calculadoras: el motor devuelve mediodia UTC
// en vencimiento y medianoche local en las demas, y las dos se leen bien asi.
var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
    'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function larga(f) {
    var d = DIAS[f.getDay()];
    return d.charAt(0).toUpperCase() + d.slice(1) + ', ' + f.getDate() + ' de ' + MESES[f.getMonth()] + ' de ' + f.getFullYear();
}
function corta(f) { return f.getDate() + '/' + (f.getMonth() + 1) + '/' + f.getFullYear(); }
function dias(n, que) { return n + (n === 1 ? ' día ' + que : ' días ' + que + 's'); }

function mostrar(html) { $('respuesta').innerHTML = html; }
function texto(t) { var s = document.createElement('span'); s.textContent = t; return s.innerHTML; }
function espera(t) { mostrar('<p class="espera">' + t + '</p>'); }

function resultado(rotulo, fecha, renglones) {
    mostrar('<div class="rotulo">' + rotulo + '</div><div class="fecha">' + fecha + '</div>' +
        renglones.map(function (r) { return '<p>' + r + '</p>'; }).join(''));
}

// --- Cada herramienta: leer, pedirle al motor, mostrar -----------------------
// Cada una devuelve el enlace a la calculadora completa con el caso, con los
// nombres de contrato de ESTADO.md («El caso en el enlace»).

function vencimiento(fecha) {
    var auto = document.querySelector('input[name=modalidad]:checked').value === 'automatica';
    $('caja-horario').hidden = auto;
    $('caja-nota').hidden = !auto;
    $('rotulo-fecha').textContent = auto ? 'Resolución firmada el' : 'Notificada el';
    var plazo = entero('plazo', 1);
    var enlace = { modalidad: auto ? 'automatica' : 'cedula', fecha: fecha && ymd(fecha), plazo: plazo };
    if (!listo) return enlace;
    if (!fecha || !plazo) { espera('Cargá la fecha y el plazo.'); return enlace; }
    if (auto && $('hubo-nota').checked) {
        espera('Con notas en el Libro de Asistencia el día de notificación cambia: se marcan en el cómputo completo.');
        return enlace;
    }
    var r = Plazos.vencimiento({
        modalidad: enlace.modalidad,
        anio: fecha.anio, mes: fecha.mes, dia: fecha.dia,
        plazo: plazo,
        fueraDeHorario: !auto && $('fuera-de-horario').checked,
        notasDejadas: []
    });
    // Apenas vuelve el motor y antes de mostrar (js/dias-propios.js).
    var propios = DiasPropios.usadosEnElCalculo();
    if (r.problema) return problema(r.problema, enlace);
    resultado('Vence el', larga(r.vencimiento), [
        'a las 9:30 hs., por el plazo de gracia del art. 124 CPCCN',
        'Sin plazo de gracia: ' + larga(r.vencimientoSinGracia) + '.',
        (auto ? 'Notificada el ' + corta(r.fechaNotificacion) + ' (art. 133 CPCCN). ' : '') +
            'Corre desde el ' + corta(r.fechaInicioConteo) + '; ' + dias(r.plazo, 'hábil') + '.'
    ]);
    DiasPropios.anotar($('respuesta'), propios);
    return enlace;
}

function caducidad(fecha) {
    var meses = entero('meses', 1);
    var enlace = { fecha: fecha && ymd(fecha), meses: meses && meses <= 6 ? meses : null };
    if (!listo) return enlace;
    if (!fecha || !meses) { espera('Cargá la fecha y el plazo en meses.'); return enlace; }
    var r = Plazos.caducidad({ anio: fecha.anio, mes: fecha.mes, dia: fecha.dia, meses: meses });
    var propios = DiasPropios.usadosEnElCalculo();
    if (r.problema) return problema(r.problema, enlace);
    resultado('La caducidad se produce el día', larga(r.vencimiento), [
        'Desde el último acto impulsor del ' + corta(r.inicio) + ', por un plazo de ' +
            meses + (meses === 1 ? ' mes.' : ' meses.')
    ]);
    DiasPropios.anotar($('respuesta'), propios);
    return enlace;
}

function mora(fecha) {
    var firme = entero('firme', 1);
    var pago = entero('pago', 0);
    var enlace = { fecha: fecha && ymd(fecha), firme: firme, pago: pago };
    if (!listo) return enlace;
    if (!fecha || firme === null || pago === null) { espera('Cargá la fecha y los dos plazos.'); return enlace; }
    var r = Plazos.mora({ anio: fecha.anio, mes: fecha.mes, dia: fecha.dia, diasHabiles: firme, diasCorridos: pago });
    var propios = DiasPropios.usadosEnElCalculo();
    if (r.problema) return problema(r.problema, enlace);
    resultado('Vencimiento del pago', larga(r.vencimiento), [
        'Firme el ' + corta(r.firme) + ', a los ' + dias(firme, 'hábil') + '.',
        'Después, ' + dias(pago, 'corrido') + ' para pagar.'
    ]);
    DiasPropios.anotar($('respuesta'), propios);
    return enlace;
}

function entre(fecha) {
    var hastaCrudo = $('hasta').value.trim();
    var hasta = leerFecha(hastaCrudo);
    $('hasta').classList.toggle('invalido', hastaCrudo !== '' && !hasta);
    var habiles = $('solo-habiles').checked;
    var enlace = { desde: fecha && ymd(fecha), hasta: hasta && ymd(hasta),
        inicio: $('incluir-inicio').checked ? 'si' : 'no', fin: $('incluir-fin').checked ? 'si' : 'no',
        habiles: habiles ? 'si' : 'no' };
    if (!listo) return enlace;
    if (!fecha || !hasta) { espera(hastaCrudo && !hasta ? 'La fecha tiene que ser dd/mm/aaaa, y existir.' : 'Cargá las dos fechas.'); return enlace; }
    var d = new Date(fecha.anio, fecha.mes - 1, fecha.dia), h = new Date(hasta.anio, hasta.mes - 1, hasta.dia);
    if (d > h) { espera('La primera fecha tiene que ser anterior a la segunda.'); return enlace; }
    var r = Plazos.entreFechas({ desde: fecha, hasta: hasta,
        incluirInicio: $('incluir-inicio').checked, incluirFin: $('incluir-fin').checked, soloHabiles: habiles });
    // Con corridos el motor no reinicia la auditoria: la lista seria de otro
    // calculo. Lo mismo hace entre-fechas.html.
    var propios = habiles ? DiasPropios.usadosEnElCalculo() : [];
    if (r.problema) return problema(r.problema, enlace);
    resultado(habiles ? 'Días hábiles' : 'Días corridos', String(r.total), [
        'Del ' + corta(r.desde) + ' al ' + corta(r.hasta) + ', ' +
            ($('incluir-inicio').checked ? 'contando' : 'sin contar') + ' el de inicio y ' +
            ($('incluir-fin').checked ? 'contando' : 'sin contar') + ' el de fin.'
    ]);
    DiasPropios.anotar($('respuesta'), propios);
    return enlace;
}

function problema(t, enlace) {
    mostrar('<p class="problema"><strong>No se puede calcular.</strong> ' + texto(t) + '</p>');
    DiasPropios.anotar($('respuesta'), []);
    return enlace;
}

var CALCULO = { vencimiento: vencimiento, caducidad: caducidad, mora: mora, entre: entre };

function calcular() {
    var h = HERRAMIENTAS[herramienta];
    document.querySelectorAll('[data-solo]').forEach(function (n) {
        n.hidden = n.dataset.solo !== herramienta;
    });
    document.querySelectorAll('[data-herramienta]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.herramienta === herramienta));
    });
    $('rotulo-fecha').textContent = h.fecha;
    $('nota').textContent = h.nota;

    var crudaFecha = $('fecha').value.trim();
    var fecha = leerFecha(crudaFecha);
    $('fecha').classList.toggle('invalido', crudaFecha !== '' && !fecha);

    // Un resultado nunca queda al lado de datos que no son los suyos: con el
    // formulario incompleto vuelve la espera (la regla de calcula-solo.js).
    var enlace = (crudaFecha && !fecha && listo)
        ? (espera('La fecha tiene que ser dd/mm/aaaa, y existir.'), {})
        : CALCULO[herramienta](fecha);

    var partes = [];
    Object.keys(enlace).forEach(function (k) {
        if (enlace[k] !== null && enlace[k] !== undefined && enlace[k] !== '') partes.push(k + '=' + enlace[k]);
    });
    $('completo').href = h.pagina + (partes.length ? '#' + partes.join('&') : '');
}

function elegir(cual) {
    if (!HERRAMIENTAS[cual]) return;
    herramienta = cual;
    calcular();
}

// --- El caso que llega en el fragmento ---------------------------------------
// Lo manda la extension: #herramienta=caducidad&fecha=AAAA-MM-DD&hasta=…
// &plazo=5&tomado=… Va en el # por lo mismo que en las calculadoras: no
// viaja en ningun request. No recarga la pagina: el panel sigue abierto y
// recibe un caso tras otro.
function aTexto(v) {
    var f = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
    return f ? (+f[3]) + '/' + (+f[2]) + '/' + f[1] : '';
}
function leerFragmento() {
    if (!location.hash || location.hash.length < 2) return;
    var p = new URLSearchParams(location.hash.slice(1));
    if (HERRAMIENTAS[p.get('herramienta')]) herramienta = p.get('herramienta');
    // Un caso sin fecha borra la anterior: si no, el resultado viejo queda
    // al lado del aviso de que esta vez no se encontro ninguna.
    $('fecha').value = aTexto(p.get('fecha'));
    if (p.has('hasta')) $('hasta').value = aTexto(p.get('hasta'));
    if (/^\d{1,3}$/.test(p.get('plazo') || '')) $('plazo').value = p.get('plazo');
    var mod = p.get('modalidad');
    if (mod === 'cedula' || mod === 'automatica') {
        document.querySelector('input[name=modalidad][value=' + mod + ']').checked = true;
    }
    $('tomado').textContent = p.get('tomado') || '';
    calcular();
}
window.addEventListener('hashchange', leerFragmento);

// --- Arranque ----------------------------------------------------------------
$('form').addEventListener('input', calcular);
$('form').addEventListener('change', calcular);
$('form').addEventListener('submit', function (e) { e.preventDefault(); calcular(); });
document.querySelectorAll('[data-herramienta]').forEach(function (b) {
    b.addEventListener('click', function () { elegir(b.dataset.herramienta); });
});
document.querySelectorAll('[data-hoy]').forEach(function (b) {
    b.addEventListener('click', function () {
        var h = new Date();
        $(b.dataset.hoy).value = h.getDate() + '/' + (h.getMonth() + 1) + '/' + h.getFullYear();
        calcular();
    });
});
document.querySelectorAll('[data-poner]').forEach(function (b) {
    b.addEventListener('click', function () { $(b.dataset.poner).value = b.dataset.valor; calcular(); });
});
// Si cambian los dias inhabiles propios ---aca o en otra pestaña del sitio---
// dias-propios.js repinta su aviso; se recalcula, para que el resultado sea
// el de la lista nueva y no quede el aviso de «volvé a calcular».
new MutationObserver(function () { if (listo) calcular(); })
    .observe(document.querySelector('[data-dias-propios]'), { childList: true });

(async function () {
    var anios = [];
    for (var y = MIN_YEAR; y <= MAX_YEAR; y++) anios.push(y);
    var res = await CalendarioJudicial.init(anios);
    if (!res.dataLoaded) {
        $('hoy').textContent = res.missingYears && res.missingYears.length
            ? 'No se puede calcular: faltan los feriados de ' + res.missingYears.join(', ') + '.'
            : 'No se puede calcular: no se pudieron cargar los feriados.';
        return;
    }
    listo = true;
    var h = new Date();
    var hoyUTC = new Date(Date.UTC(h.getFullYear(), h.getMonth(), h.getDate(), 12));
    var habil = CalendarioJudicial.esDiaHabil(hoyUTC);
    $('hoy').innerHTML = 'Hoy, ' + texto(larga(h).toLowerCase()) + ': <b>' + (habil ? 'día hábil' : 'inhábil') + '</b>';
    leerFragmento();
    calcular();
})();
</script>
</body>
</html>
