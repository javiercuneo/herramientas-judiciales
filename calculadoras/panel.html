<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plazo al paso</title>
<meta name="description" content="Cuándo vence un plazo, en una pantalla angosta: la del panel lateral de la extensión.">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/comun.css">
<script src="../assets/tema.js"></script>
<style>
    /* ------------------------------------------------------------------
       La pantalla del panel lateral (27/10/2026).

       Existe porque el tablero entero, metido en un panel de 360 px, se
       veia chico y apretado, y el resultado quedaba abajo de todo: Javier
       no encontro la fecha. Esta pantalla es la respuesta primero y el
       formulario despues, y nada mas.

       NO CALCULA NADA PROPIO. El computo es Plazos.vencimiento(), el mismo
       motor que usa vencimientos.html, con el mismo calendario. Lo que vive
       aca es leer cuatro campos y mostrar. Lo que esta pantalla no pregunta
       ---la ampliacion por distancia, las notas del Libro de Asistencia---
       no se supone: se manda a la calculadora completa.
       ------------------------------------------------------------------ */
    body { margin: 0; padding: 12px 14px 20px; font-size: 15px; }
    .hoy { color: var(--muted-fg); font-size: 13px; margin: 0 0 10px; }
    .hoy b { color: var(--fg); font-weight: 600; }

    .respuesta {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius, 10px);
        padding: 14px;
        margin-bottom: 14px;
        min-height: 92px;
    }
    .respuesta .rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-fg); }
    .respuesta .fecha {
        font-family: var(--font-meter);
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
        margin: 2px 0 4px;
        color: var(--accent);
    }
    .respuesta .hora, .respuesta .alterno, .respuesta .desde { font-size: 13px; color: var(--muted-fg); margin: 2px 0 0; }
    .respuesta .espera { color: var(--muted-fg); margin: 0; }
    .respuesta .problema { color: var(--error); margin: 0; }
    .respuesta.origen-aviso { border-color: var(--accent); }

    .tomado { font-size: 13px; color: var(--muted-fg); margin: -6px 0 12px; }
    .tomado:empty { display: none; }

    form { display: grid; gap: 12px; }
    label.campo { display: grid; gap: 4px; font-size: 13px; color: var(--muted-fg); }
    input[type=text] {
        font: inherit;
        font-size: 17px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
        width: 100%;
        box-sizing: border-box;
    }
    input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    input.invalido { border-color: var(--error); }
    .fila { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .fila input[type=text] { flex: 1; min-width: 0; }
    button.chico {
        font: inherit;
        font-size: 13px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--sunk);
        color: var(--fg);
        cursor: pointer;
    }
    button.chico:hover { border-color: var(--accent); }

    .modalidad { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .modalidad label { text-align: center; padding: 8px 4px; cursor: pointer; font-size: 14px; background: var(--card); }
    .modalidad input { position: absolute; opacity: 0; pointer-events: none; }
    .modalidad label:has(input:checked) { background: var(--accent); color: var(--on-accent); }
    .modalidad label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -3px; }

    .casilla { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
    .casilla input { margin-top: 3px; }
    [hidden] { display: none !important; }

    .completo { font-size: 14px; margin: 14px 0 0; }
    a { color: var(--accent); }
    .nota { font-size: 12px; color: var(--faint); margin: 16px 0 0; line-height: 1.5; }
</style>
</head>
<body>

<p class="hoy" id="hoy">Cargando el calendario…</p>

<section class="respuesta" id="respuesta" aria-live="polite">
    <p class="espera">Cargá la fecha y el plazo.</p>
</section>
<p class="tomado" id="tomado"></p>

<form id="form" autocomplete="off" novalidate>
    <div class="modalidad" role="radiogroup" aria-label="Cómo se notificó">
        <label><input type="radio" name="modalidad" value="cedula" checked> Cédula</label>
        <label><input type="radio" name="modalidad" value="automatica"> Automática</label>
    </div>

    <label class="campo"><span id="rotulo-fecha">Notificada el</span>
        <span class="fila">
            <input type="text" id="fecha" inputmode="numeric" placeholder="dd/mm/aaaa" aria-describedby="rotulo-fecha">
            <button type="button" class="chico" id="hoy-boton">Hoy</button>
        </span>
    </label>

    <label class="campo">Plazo, en días hábiles
        <span class="fila">
            <input type="text" id="plazo" inputmode="numeric" placeholder="5">
            <button type="button" class="chico" data-plazo="3">3</button>
            <button type="button" class="chico" data-plazo="5">5</button>
            <button type="button" class="chico" data-plazo="10">10</button>
            <button type="button" class="chico" data-plazo="15">15</button>
        </span>
    </label>

    <label class="casilla" id="caja-horario">
        <input type="checkbox" id="fuera-de-horario">
        <span>La cédula se diligenció fuera del horario hábil (antes de las 7 o después de las 20)</span>
    </label>
    <label class="casilla" id="caja-nota" hidden>
        <input type="checkbox" id="hubo-nota">
        <span>Se dejó nota en el Libro de Asistencia</span>
    </label>
</form>

<p class="completo"><a id="completo" href="vencimientos.html" target="_blank" rel="noopener">El cómputo completo, con el calendario</a></p>

<p class="nota">Sin ampliación por distancia ni días inhábiles propios: para eso, el cómputo completo.
Feriados y asuetos por Acordada del calendario del sitio.</p>

<script src="js/calendario-judicial.js"></script>
<script src="js/plazos.js"></script>
<script>
'use strict';

// Los mismos anios que carga vencimientos.html: de 2021 al que viene.
var MIN_YEAR = 2021;
var MAX_YEAR = new Date().getFullYear() + 1;
var listo = false;

var $ = function (id) { return document.getElementById(id); };

// --- Fechas ------------------------------------------------------------------
// Se acepta lo que se selecciona en el PJN: 14/10/2026, 14/1/2026, 14-10-2026,
// 14.10.2026. El anio con cuatro cifras: con dos, 26 puede ser 1926 o 2026, y
// eso no se adivina.
function leerFecha(texto) {
    var m = /^\s*(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})\s*$/.exec(texto || '');
    if (!m) return null;
    var d = +m[1], me = +m[2], a = +m[3];
    var f = new Date(a, me - 1, d);
    if (f.getFullYear() !== a || f.getMonth() !== me - 1 || f.getDate() !== d) return null;
    return { anio: a, mes: me, dia: d };
}

function dos(n) { return (n < 10 ? '0' : '') + n; }

// Mismo formato que vencimientos.html (formatearFecha), con getters locales:
// el motor devuelve mediodia UTC y asi lo lee esa pantalla.
var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
    'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function larga(f) {
    var d = DIAS[f.getDay()];
    return d.charAt(0).toUpperCase() + d.slice(1) + ', ' + f.getDate() + ' de ' + MESES[f.getMonth()] + ' de ' + f.getFullYear();
}
function corta(f) { return f.getDate() + '/' + (f.getMonth() + 1) + '/' + f.getFullYear(); }

// --- Lo que se ve ------------------------------------------------------------
function modalidad() { return document.querySelector('input[name=modalidad]:checked').value; }

function mostrar(html) { $('respuesta').innerHTML = html; }
function texto(t) { var s = document.createElement('span'); s.textContent = t; return s.innerHTML; }

function calcular() {
    var auto = modalidad() === 'automatica';
    $('caja-horario').hidden = auto;
    $('caja-nota').hidden = !auto;
    $('rotulo-fecha').textContent = auto ? 'Resolución firmada el' : 'Notificada el';

    var crudaFecha = $('fecha').value.trim();
    var crudoPlazo = $('plazo').value.trim();
    var fecha = leerFecha(crudaFecha);
    var plazo = /^\d{1,3}$/.test(crudoPlazo) ? parseInt(crudoPlazo, 10) : NaN;

    $('fecha').classList.toggle('invalido', crudaFecha !== '' && !fecha);
    $('plazo').classList.toggle('invalido', crudoPlazo !== '' && !(plazo >= 1));
    actualizarEnlace(fecha, plazo);

    if (!listo) return;
    // Un resultado nunca queda al lado de datos que no son los suyos: con el
    // formulario incompleto vuelve la espera (la regla de calcula-solo.js).
    if (!fecha || !(plazo >= 1)) {
        mostrar('<p class="espera">' + (crudaFecha && !fecha
            ? 'La fecha tiene que ser dd/mm/aaaa, y existir.'
            : 'Cargá la fecha y el plazo.') + '</p>');
        return;
    }
    if (auto && $('hubo-nota').checked) {
        mostrar('<p class="espera">Con notas en el Libro de Asistencia el día de notificación cambia: ' +
            'se marcan en el <a href="' + $('completo').href + '" target="_blank" rel="noopener">cómputo completo</a>.</p>');
        return;
    }

    var r = Plazos.vencimiento({
        modalidad: modalidad(),
        anio: fecha.anio, mes: fecha.mes, dia: fecha.dia,
        plazo: plazo,
        fueraDeHorario: !auto && $('fuera-de-horario').checked,
        notasDejadas: []
    });
    if (r.problema) {
        mostrar('<p class="problema"><strong>No se puede calcular.</strong> ' + texto(r.problema) + '</p>');
        return;
    }
    mostrar(
        '<div class="rotulo">Vence el</div>' +
        '<div class="fecha">' + larga(r.vencimiento) + '</div>' +
        '<p class="hora">a las 9:30 hs., por el plazo de gracia del art. 124 CPCCN</p>' +
        '<p class="alterno">Sin plazo de gracia: ' + larga(r.vencimientoSinGracia) + '.</p>' +
        '<p class="desde">' + (auto ? 'Notificada el ' + corta(r.fechaNotificacion) + ' (art. 133 CPCCN). ' : '') +
        'Corre desde el ' + corta(r.fechaInicioConteo) + '; ' + r.plazo + (r.plazo === 1 ? ' día hábil.' : ' días hábiles.') + '</p>'
    );
}

// El enlace a la calculadora completa lleva el caso, con los nombres de
// contrato de vencimientos (ESTADO.md, «El caso en el enlace").
function actualizarEnlace(fecha, plazo) {
    var partes = ['modalidad=' + modalidad()];
    if (fecha) partes.push('fecha=' + fecha.anio + '-' + dos(fecha.mes) + '-' + dos(fecha.dia));
    if (plazo >= 1) partes.push('plazo=' + plazo);
    $('completo').href = 'vencimientos.html#' + partes.join('&');
}

// --- El caso que llega en el fragmento ---------------------------------------
// Lo manda la extension: #fecha=AAAA-MM-DD&plazo=5&modalidad=cedula&tomado=...
// Va en el # por lo mismo que en las calculadoras: no viaja en ningun request.
// No recarga la pagina: el panel sigue abierto y recibe un caso tras otro.
function leerFragmento() {
    if (!location.hash || location.hash.length < 2) return;
    var p = new URLSearchParams(location.hash.slice(1));
    var f = /^(\d{4})-(\d{2})-(\d{2})$/.exec(p.get('fecha') || '');
    // Un caso sin fecha borra la anterior: si no, el resultado viejo queda
    // al lado del aviso de que esta vez no se encontro ninguna.
    $('fecha').value = f ? (+f[3]) + '/' + (+f[2]) + '/' + f[1] : '';
    if (/^\d{1,3}$/.test(p.get('plazo') || '')) $('plazo').value = p.get('plazo');
    var mod = p.get('modalidad');
    if (mod === 'cedula' || mod === 'automatica') {
        document.querySelector('input[name=modalidad][value=' + mod + ']').checked = true;
    }
    $('tomado').textContent = p.get('tomado') || '';
    calcular();
    if (!$('plazo').value) $('plazo').focus();
}
window.addEventListener('hashchange', leerFragmento);

// --- Arranque ----------------------------------------------------------------
$('form').addEventListener('input', calcular);
$('form').addEventListener('change', calcular);
$('form').addEventListener('submit', function (e) { e.preventDefault(); calcular(); });
$('hoy-boton').addEventListener('click', function () {
    var h = new Date();
    $('fecha').value = h.getDate() + '/' + (h.getMonth() + 1) + '/' + h.getFullYear();
    calcular();
});
document.querySelectorAll('[data-plazo]').forEach(function (b) {
    b.addEventListener('click', function () { $('plazo').value = b.dataset.plazo; calcular(); });
});

(async function () {
    var anios = [];
    for (var y = MIN_YEAR; y <= MAX_YEAR; y++) anios.push(y);
    var res = await CalendarioJudicial.init(anios);
    if (!res.dataLoaded) {
        $('hoy').textContent = res.missingYears && res.missingYears.length
            ? 'No se puede calcular: faltan los feriados de ' + res.missingYears.join(', ') + '.'
            : 'No se puede calcular: no se pudieron cargar los feriados.';
        return;
    }
    listo = true;
    var h = new Date();
    var hoyUTC = new Date(Date.UTC(h.getFullYear(), h.getMonth(), h.getDate(), 12));
    var habil = CalendarioJudicial.esDiaHabil(hoyUTC);
    $('hoy').innerHTML = 'Hoy, ' + texto(larga(h).toLowerCase()) + ': <b>' + (habil ? 'día hábil' : 'inhábil') + '</b>';
    leerFragmento();
    calcular();
})();
</script>
</body>
</html>
