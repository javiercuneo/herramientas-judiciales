<!-- Contador de visitas (GoatCounter), sin cookies. Manda la ruta, el titulo,

     no sale nunca, y es donde viaja un caso: por eso un dato del caso no se

<style>
    /* ==================================================================
       No se redefine ningun token de comun.css aca. `--accent: var(--accent)`
       es una dependencia ciclica: la propiedad queda invalida en tiempo de
       computo y var() devuelve la cadena vacia, sin ningun error visible. Asi
       quedaron mora y honorarios-mediacion con el boton blanco sobre blanco,
       en produccion.

       Rehecho el 21/10/2026 como tablero de verdad: un menu lateral con TODAS
       las herramientas a la vista, y una sola abierta por vez. Hasta ese dia
       habia dos regiones ---plazos arriba con pestañas, lo demas abajo con
       tarjetas--- que se abrian por separado, y el resultado era una pagina
       con dos calculadoras abiertas, la barra fija de arriba marcando una que
       no era la que se miraba, y la de abajo abriendose sin que la pagina
       bajara hasta ella.

       El criterio de Javier, 21/10: «uno trabaja con distintos temas que
       vienen en forma sucesiva ---una contestacion de demanda, despues la
       tasa, despues un prorrateo de otro expediente--- y no agrupa
       contestaciones para verificar diez plazos. Todo tiene que estar
       accesible todo el tiempo». Los grupos quedan como rotulos del menu, no
       como dos regiones de la pagina.
       ================================================================== */

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.6;
    }

    .app {
        display: grid;
        grid-template-columns: 252px minmax(0, 1fr);
        max-width: 1480px;
        margin: 0 auto;
        min-height: 100vh;
    }

    /* ------------------------------------------------------------- lateral
       Fijo a la izquierda y siempre entero: es lo que hace que cualquier
       herramienta este a un click desde cualquier lugar de la pagina, sin
       subir. Si no entra en el alto de la ventana, scrollea solo el. */
    .lateral {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--hair);
        padding: 22px 14px 18px;
        scrollbar-width: thin;
    }

    .marca { padding: 0 8px 16px; }
    .marca .inicio {
        display: inline-block;
        font-size: 11.5px;
        color: var(--faint);
        text-decoration: none;
        margin-bottom: 6px;
    }
    .marca .inicio:hover { color: var(--accent); }
    .marca .nombre {
        display: block;
        font-family: var(--font-meter);
        font-size: 18px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--fg);
    }
    .marca .nombre span { color: var(--accent); }

    /* El boton que despliega el menu. Solo existe en pantalla chica. */
    .abrir-menu { display: none; }

    .menu { flex: 1 0 auto; }

    .grupo-rotulo {
        margin: 16px 8px 5px;
        font-family: var(--font-meter);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
    }
    .grupo-rotulo:first-child { margin-top: 0; }

    .lista { display: flex; flex-direction: column; gap: 1px; }

    .item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: var(--muted-fg);
        font-family: var(--font-sans);
        font-size: 13.5px;
        font-weight: 500;
        line-height: 1.3;
        padding: 7px 9px;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.12s, color 0.12s;
    }
    .item:hover { color: var(--fg); background: var(--sunk); }
    .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .item[aria-selected="true"] {
        background: var(--accent-tint);
        color: var(--accent);
        font-weight: 600;
    }
    .item .rot { flex: 1 1 auto; min-width: 0; }

    /* El numero de atajo. De contorno y sin relleno: con relleno de --border
       el numero leia 3,30 contra el fondo compuesto (ver HISTORIA.md, 26/8). */
    .atajo {
        flex: none;
        font-family: var(--font-meter);
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        padding: 2px 5px;
        border-radius: 4px;
        border: 1px solid var(--border);
        color: var(--muted-fg);
    }
    .item[aria-selected="true"] .atajo { border-color: currentColor; color: inherit; }

    .etiqueta {
        flex: none;
        font-family: var(--font-meter);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--faint);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 4px;
        white-space: nowrap;
    }
    .item .flecha { flex: none; color: var(--faint); }

    .pie-lateral {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid var(--hair);
    }
    .pie-lateral a {
        font-size: 12.5px;
        color: var(--muted-fg);
        text-decoration: none;
        padding: 4px 9px;
        border-radius: 6px;
    }
    .pie-lateral a:hover { color: var(--accent); background: var(--sunk); }
    .pie-lateral .lugar-tema { padding: 6px 9px 0; }

    /* El interruptor de tema lo agrega tema.js al body, fijo arriba a la
       derecha. En el tablero se tapaba con la barra y con «¿Algo salió mal?»:
       se muda al pie del menu y deja de flotar. */
    .tema-boton.en-lateral {
        position: static !important;
        top: auto !important;
        right: auto !important;
    }

    /* ----------------------------------------------------------- principal */
    .principal { min-width: 0; padding: 20px 28px 0; }

    /* La franja de datos del dia: hoy, los dos valores con los que se regulan
       honorarios y hasta donde llega el calendario. No dependen de que
       herramienta este abierta, asi que se dicen una vez arriba. */
    .estado {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 28px;
        align-items: baseline;
        padding: 11px 16px;
        background: var(--sunk);
        border: 1px solid var(--hair);
        border-radius: 11px;
    }
    .dato .r {
        display: block;
        font-family: var(--font-meter);
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 1px;
    }
    .dato .v {
        font-family: var(--font-meter);
        font-size: 14px;
        font-weight: 700;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
    }
    .dato .n { font-size: 12px; font-weight: 400; color: var(--muted-fg); margin-left: 6px; }
    .dato .no-cuenta, .dato .falta { color: var(--warn); }

    /* -------------------------------------------------------------- panel */
    .panel { display: none; }
    .panel.activo { display: block; }

    .marco-caja { margin: 8px 0 0; }
    .marco-caja iframe {
        display: block;
        width: 100%;
        height: 900px;
        border: 0;
    }

    /* Honorio vive en otro sitio (honorio.ar) y el navegador no deja medir ni
       tocar lo que pasa adentro de un marco de otro origen: no se le puede
       ajustar el alto al contenido. Va con el alto de la ventana y scrollea
       adentro, como lo abre el ledger. */
    .marco-caja.externo iframe {
        height: calc(100vh - 150px);
        min-height: 560px;
        border: 1px solid var(--hair);
        border-radius: 12px;
    }
    .aviso-externo {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 6px 16px;
        margin: 18px 0 10px;
        font-size: 12.5px;
        color: var(--muted-fg);
    }
    .aviso-externo a { color: var(--accent); text-decoration: none; }
    .aviso-externo a:hover { text-decoration: underline; }

    .cargando {
        margin: 0;
        padding: 70px 20px;
        text-align: center;
        color: var(--faint);
        font-size: 13px;
    }

    .vh {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
    }

    /* ------------------------------------------------------------ colofon */
    .colofon {
        margin-top: 46px;
        padding: 18px 0 36px;
        border-top: 1px solid var(--hair);
        color: var(--muted-fg);
        font-size: 12.5px;
    }
    .colofon p { margin: 0; }

    /* ------------------------------------------------- pantalla chica
       El menu lateral se vuelve una barra fija arriba con el nombre de la
       herramienta abierta, y el menu entero se despliega con un toque. Antes
       era una fila de pestañas que scrolleaba de costado y en un celular se
       veian dos de seis, sin nada que dijera que habia mas. */
    @media (max-width: 900px) {
        .app { display: block; }

        .lateral {
            position: sticky;
            top: 0;
            z-index: 20;
            height: auto;
            max-height: 100vh;
            overflow: visible;
            padding: 10px 14px;
            background: var(--bg);
            border-right: 0;
            border-bottom: 1px solid var(--border);
        }

        .marca {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            padding: 0 0 8px;
        }
        .marca .inicio { order: 2; margin: 0; }
        .marca .nombre { font-size: 15px; }

        .abrir-menu {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 9px 12px;
            cursor: pointer;
            text-align: left;
        }
        .abrir-menu .rot { flex: 1 1 auto; }
        .abrir-menu .cuenta { font-size: 12px; font-weight: 500; color: var(--faint); }
        .abrir-menu svg { flex: none; transition: transform 0.15s; }
        .abrir-menu[aria-expanded="true"] svg { transform: rotate(180deg); }

        .desplegable {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
            padding: 6px 14px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 12px 24px rgb(0 0 0 / 0.25);
        }
        .lateral.abierto .desplegable { display: block; }
        .item { padding: 10px 10px; font-size: 14.5px; }

        .principal { padding: 14px 14px 0; }

        .estado {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 14px;
            padding: 10px 12px;
        }
        .dato:first-child, .dato.ancho { grid-column: 1 / -1; }
        .dato .v { font-size: 13.5px; }
        .dato .n { display: block; margin-left: 0; font-size: 11.5px; }
        .dato:first-child .n { display: inline; margin-left: 6px; }
        /* En el celular la franja no puede comerse media pantalla. El rango
           del calendario se calla mientras este todo; si falta algo que
           impide calcular, aparece. */
        .dato.ancho:not(:has(.falta)) { display: none; }

        .marco-caja.externo iframe { height: calc(100vh - 170px); }
    }

    @media (min-width: 901px) {
        .desplegable { display: contents; }
    }
</style>
</head>
<body>

<div class="app">
    <aside class="lateral" id="lateral">
        <div class="marca">
            <a class="inicio" href="../index.html">← Inicio</a>
            <span class="nombre">Tablero de <span>herramientas</span></span>
        </div>

        <button type="button" class="abrir-menu" id="abrirMenu" aria-expanded="false" aria-controls="desplegable">
            <span class="rot" id="menuActual">Plazos judiciales</span>
            <span class="cuenta" id="menuCuenta"></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

        <div class="desplegable" id="desplegable">
            <nav class="menu" aria-label="Herramientas">
                <p class="grupo-rotulo" id="rotulo-plazos">Plazos</p>
                <div class="lista" id="tabs-plazos" role="tablist" aria-labelledby="rotulo-plazos" aria-orientation="vertical"></div>

                <p class="grupo-rotulo" id="rotulo-otras">Honorarios y otros</p>
                <div class="lista" id="tabs-otras" role="tablist" aria-labelledby="rotulo-otras" aria-orientation="vertical"></div>

                <!-- Lo que se abre aparte. No es una pestaña: va a otra página. -->
                <p class="grupo-rotulo">Aparte</p>
                <div class="lista" id="enlaces-otras"></div>
            </nav>

            <div class="pie-lateral">
                <a href="../documentacion.html">Guía de uso</a>
                <a href="mailto:javier@javiercuneo.com.ar?subject=Tablero%20de%20herramientas">¿Algo salió mal?</a>
                <div class="lugar-tema" id="lugarTema"></div>
            </div>
        </div>
    </aside>

    <main class="principal">
        <!-- Los datos del día. Ninguno depende de qué herramienta esté
             abierta, y por eso se dicen una vez acá arriba y no una vez por
             calculadora. -->
        <div class="estado" id="estado">
            <div class="dato">
                <span class="r">Hoy</span>
                <span class="v" id="dato-hoy">—</span>
            </div>
            <div class="dato">
                <span class="r">UMA · ley 27.423</span>
                <span class="v" id="dato-uma">—</span>
            </div>
            <div class="dato">
                <span class="r">UHOM · decreto 2536/15</span>
                <span class="v" id="dato-uhom">—</span>
            </div>
            <div class="dato ancho">
                <span class="r">Calendario judicial</span>
                <span class="v" id="dato-calendario">—</span>
            </div>
        </div>

        <div id="paneles-plazos"></div>
        <div id="paneles-otras"></div>

        <!-- El pie de autoría vive acá y sólo acá. Las calculadoras que lo traen
             lo ocultan adentro del marco por CSS inyectado. -->
        <div class="colofon">
            <p>© 2026 L. Javier Cúneo Libarona · Herramienta de referencia: no sustituye el criterio del juez</p>
        </div>
    </main>
</div>

<script src="js/calendario-judicial.js"></script>
<!-- Sin aviso propio en la portada: lo lleva cada calculadora adentro de su
     marco, al lado del numero. El tablero lo carga para abrir el panel de
     dias propios en la pagina de arriba y no adentro de un marco. -->
<script src="js/dias-propios.js"></script>
<script>
'use strict';

// ---------------------------------------------------------------------------
// El tablero NO reimplementa ninguna calculadora: las embebe.
//
// La alternativa era fusionar los HTML en uno. Se descarto: hay colisiones de
// id reales entre ellos —`plazo` esta en caducidad y en vencimientos;
// `dia`/`day`, `mes`/`month`— y cada colision es una oportunidad de mover un
// numero en aritmetica de consecuencia juridica. Con iframes el riesgo de que
// el tablero cambie un resultado es cero, porque el codigo que calcula es
// literalmente el mismo archivo que ya esta publicado.
// ---------------------------------------------------------------------------

// UN SOLO MENU, dos grupos con rotulo, y una sola herramienta abierta por vez
// (21/10/2026). Hasta ese dia eran dos regiones independientes de la pagina
// ---decision del 26/8, en HISTORIA.md---, y Javier la reviso: el trabajo no
// viene agrupado por materia sino en el orden de los escritos, asi que todo
// tiene que estar a un click. Los grupos siguen para ubicarse, no para separar.
//
// Se conservan dos tablist ---uno por grupo--- porque un tablist solo puede
// tener pestañas adentro, y el rotulo del grupo tiene que poder leerse. La
// seleccion es UNA para los dos, y las flechas recorren el menu entero.
var REGIONES = [
    {
        id: 'plazos',
        tabs: document.getElementById('tabs-plazos'),
        paneles: document.getElementById('paneles-plazos'),
        atajos: true,
        // Los rotulos siguen los nombres que decidio Javier el 31/8.
        items: [
            { id: 'vencimientos', rotulo: 'Plazos judiciales', archivo: 'vencimientos.html' },
            { id: 'distancia',    rotulo: 'Ampliación por distancia', archivo: 'distancia.html' },
            { id: 'caducidad',    rotulo: 'Caducidad',         archivo: 'caducidad.html' },
            { id: 'entre-fechas', rotulo: 'Entre fechas',      archivo: 'entre-fechas.html' },
            { id: 'regresiva',    rotulo: 'Regresiva',         archivo: 'regresiva.html' },
            { id: 'mora',         rotulo: 'Mora',              archivo: 'mora.html' }
        ]
    },
    {
        id: 'otras',
        tabs: document.getElementById('tabs-otras'),
        paneles: document.getElementById('paneles-otras'),
        atajos: false,
        items: [
            // Entra el 21/10, pedido por Javier: el calculo directo de Honorio,
            // el mismo que abre el ledger. `#directo` es contrato con el ledger
            // (ver el ESTADO.md de honorio): saltea la portada y va al calculo.
            // Es de otro origen, asi que no se le inyecta CSS ni se le mide el
            // alto: ver `externo` en montar().
            { id: 'honorio', rotulo: 'Honorio', archivo: 'https://honorio.ar/#directo',
              externo: true, sitio: 'honorio.ar',
              detalle: 'Regulación de honorarios, ley 27.423: el cálculo directo' },
            { id: 'prorrateo', rotulo: 'Prorrateo', archivo: 'prorrateo.html',
              detalle: 'Repartir honorarios entre varios' },
            { id: 'tasa', rotulo: 'Tasa de justicia', archivo: 'tasa.html',
              detalle: 'Lo que hay que integrar' },
            { id: 'mediacion', rotulo: 'Honorarios de mediación', archivo: 'honorarios-mediacion.html',
              detalle: 'La escala del decreto 1467/11, según el 2536/15' },
            // Hasta el 21/10 iba como enlace, en pestaña nueva, porque «no
            // calcula nada». Javier: el valor de la UMA tiene que estar a mano
            // como lo demas. Embebida, sin el «volver» de la pagina suelta.
            { id: 'uma-uhom', rotulo: 'Valor de la UMA y del UHOM', archivo: '../uma-uhom.html',
              cssExtra: '.volver { display: none !important; }',
              detalle: 'El valor vigente de las dos unidades, y la serie entera' },
            // Javier, 21/10: queda, con su etiqueta, aunque no este terminada.
            { id: 'ejecucion-estado', rotulo: 'Ejecución contra el Estado',
              archivo: 'ejecucion-estado.html', etiqueta: 'en desarrollo',
              detalle: 'Desde cuándo una condena contra el Estado es ejecutable' }
        ],
        // Escribiente no se embebe. Trabaja sobre un archivo del usuario, ocupa
        // la pantalla entera y su promesa es que el documento no sale de la
        // maquina ---declara `connect-src 'none'`---. Adentro de un iframe esa
        // promesa se lee peor, no mejor.
        enlaces: [
            { rotulo: 'Escribiente', archivo: '../escribiente/', etiqueta: 'en pruebas',
              detalle: 'PDF a Markdown y anonimizado, todo dentro del navegador' }
        ]
    }
];

// Son LOS MISMOS objetos que `region.items`, no copias. Con copias, el
// `h.atajo` que escribe construir() se perdia y las teclas 1-6 no hacian
// nada en produccion (1/9/2026, HISTORIA.md).
var HERRAMIENTAS = REGIONES.reduce(function (acc, r) {
    return acc.concat(r.items.map(function (h) {
        h.region = r;
        return h;
    }));
}, []);

var montados = Object.create(null);
var activa = null;

// Lo que se le inyecta a cada calculadora embebida. Es presentacion y no toca
// nada que calcule:
//   - el boton de tema de cada una se oculta: el del tablero es el que manda;
//   - `.solo-suelta` se oculta: el pie de autoria y la linea de cobertura,
//     que el tablero dice una vez;
//   - `min-height: 100vh` se anula: adentro de un iframe 100vh ES EL ALTO
//     DEL IFRAME, y el alto quedaba clavado donde arranco;
//   - el margen lateral del body se anula: se sumaba al de la pagina;
//   - en pantalla chica, todo lleva margen de scroll arriba: cuando una
//     calculadora lleva su resultado a la vista, lo dejaba debajo de la barra
//     fija del tablero, con la fecha del vencimiento tapada.
var CSS_EMBEBIDO =
    '.tema-boton { display: none !important; }' +
    '.solo-suelta { display: none !important; }' +
    'html, body { height: auto !important; min-height: 0 !important; }' +
    'body { padding-left: 0 !important; padding-right: 0 !important; ' +
    'margin-left: 0 !important; margin-right: 0 !important; }' +
    '@media (max-width: 900px) { * { scroll-margin-top: 120px; } }';

function construir() {
    var numero = 0;

    REGIONES.forEach(function (region) {
        region.items.forEach(function (h) {
            var tab = document.createElement('button');
            tab.className = 'item';
            tab.type = 'button';
            tab.id = 'tab-' + h.id;
            tab.setAttribute('role', 'tab');
            tab.setAttribute('aria-controls', 'panel-' + h.id);
            tab.setAttribute('aria-selected', 'false');
            tab.tabIndex = -1;
            if (h.detalle) tab.title = h.detalle;

            var rot = document.createElement('span');
            rot.className = 'rot';
            rot.textContent = h.rotulo;
            tab.appendChild(rot);

            if (h.etiqueta) {
                var e = document.createElement('span');
                e.className = 'etiqueta';
                e.textContent = h.etiqueta;
                tab.appendChild(e);
            }

            if (region.atajos) {
                numero++;
                if (numero <= 9) {
                    var k = document.createElement('span');
                    k.className = 'atajo';
                    k.textContent = String(numero);
                    k.setAttribute('aria-hidden', 'true');
                    tab.appendChild(k);
                    h.atajo = numero;
                }
            }

            tab.addEventListener('click', function () { activar(h.id, true, true); });
            region.tabs.appendChild(tab);

            var panel = document.createElement('div');
            panel.className = 'panel';
            panel.id = 'panel-' + h.id;
            panel.setAttribute('role', 'tabpanel');
            panel.setAttribute('aria-labelledby', 'tab-' + h.id);
            panel.innerHTML = '<div class="marco-caja"><p class="cargando">Cargando ' +
                h.rotulo.toLowerCase() + '…</p></div>';
            region.paneles.appendChild(panel);
        });

        // Los enlaces son <a> y no <button>: van a otra pagina, asi que tienen
        // que poder abrirse con el boton del medio o ctrl+click. En pestaña
        // nueva a proposito: navegar en esta tiraria todo lo cargado. Quedan
        // FUERA de los tablist y del recorrido de las flechas.
        (region.enlaces || []).forEach(function (e) {
            var caja = document.getElementById('enlaces-' + region.id);
            if (!caja) return;

            var a = document.createElement('a');
            a.className = 'item';
            a.href = e.archivo;
            a.target = '_blank';
            a.rel = 'noopener';
            if (e.detalle) a.title = e.detalle;

            var rot = document.createElement('span');
            rot.className = 'rot';
            rot.textContent = e.rotulo;
            a.appendChild(rot);
            if (e.etiqueta) {
                var et = document.createElement('span');
                et.className = 'etiqueta';
                et.textContent = e.etiqueta;
                a.appendChild(et);
            }
            var fl = document.createElement('span');
            fl.className = 'flecha';
            fl.textContent = '↗';
            fl.setAttribute('aria-hidden', 'true');
            a.appendChild(fl);
            var vh = document.createElement('span');
            vh.className = 'vh';
            vh.textContent = ' (se abre en otra pestaña)';
            a.appendChild(vh);
            caja.appendChild(a);
        });

        // Las flechas recorren el MENU ENTERO, de un grupo al otro: es un solo
        // menu. Arriba/abajo porque es vertical; izquierda/derecha tambien,
        // que es lo que la mano ya sabia de la barra de pestañas.
        region.tabs.addEventListener('keydown', function (e) {
            var n = HERRAMIENTAS.length;
            var i = HERRAMIENTAS.findIndex(function (x) { return x.id === activa; });
            var destino = null;

            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') destino = (i + 1) % n;
            else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') destino = (i - 1 + n) % n;
            else if (e.key === 'Home') destino = 0;
            else if (e.key === 'End') destino = n - 1;
            else return;

            e.preventDefault();
            activar(HERRAMIENTAS[destino].id, true, false);
        });
    });

    document.getElementById('menuCuenta').textContent = HERRAMIENTAS.length + ' herramientas';
}

// El iframe se crea recien cuando se abre la herramienta por primera vez:
// cargar las doce al arrancar son doce paginas y doce pedidos de los JSON de
// datos. Una vez creado no se destruye, para que al volver este todo como se
// dejo.
function montar(h) {
    if (montados[h.id]) return montados[h.id];

    var caja = document.querySelector('#panel-' + h.id + ' .marco-caja');
    var f = document.createElement('iframe');
    f.src = h.archivo;
    f.title = h.rotulo;
    caja.innerHTML = '';

    if (h.externo) {
        // De otro origen: no se puede medir ni tocar por dentro. Se dice de
        // donde viene y se ofrece abrirlo aparte, como lo hace el ledger.
        caja.classList.add('externo');
        var aviso = document.createElement('p');
        aviso.className = 'aviso-externo';
        var t = document.createElement('span');
        t.textContent = h.rotulo + ' corre en su propio sitio, ' + h.sitio + '.';
        var a = document.createElement('a');
        a.href = h.archivo;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'Abrir en otra pestaña ↗';
        aviso.appendChild(t);
        aviso.appendChild(a);
        caja.parentNode.insertBefore(aviso, caja);
    } else {
        f.addEventListener('load', function () { preparar(f, h); });
    }

    caja.appendChild(f);
    montados[h.id] = f;
    return f;
}

function preparar(f, h) {
    var d;
    try { d = f.contentDocument; } catch (e) { return; }
    if (!d) return;

    var s = d.createElement('style');
    s.textContent = CSS_EMBEBIDO + (h && h.cssExtra ? h.cssExtra : '');
    d.head.appendChild(s);

    sincronizarTema(f);
    ajustarAlto(f);

    // Un evento de teclado no cruza de un iframe al documento de arriba: sin
    // esto, los numeros 1-6 no hacian nada apenas tocabas una calculadora.
    d.addEventListener('keydown', atajoNumerico);
    // Y un click adentro de una calculadora cierra el menu desplegado.
    d.addEventListener('pointerdown', cerrarMenu);

    if (d.defaultView && d.defaultView.ResizeObserver) {
        var ro = new d.defaultView.ResizeObserver(function () { ajustarAlto(f); });
        ro.observe(d.documentElement);
        if (d.body) ro.observe(d.body);
    } else {
        d.addEventListener('click', function () { setTimeout(function () { ajustarAlto(f); }, 250); });
    }
}

function ajustarAlto(f) {
    var d;
    try { d = f.contentDocument; } catch (e) { return; }
    if (!d || !d.documentElement || !d.body) return;

    // Se mide el <body>, no scrollHeight del documento: scrollHeight nunca
    // baja del alto del propio iframe, asi que el marco crecia y no achicaba.
    var cs = d.defaultView.getComputedStyle(d.body);
    var alto = Math.ceil(
        d.body.getBoundingClientRect().height +
        parseFloat(cs.marginTop || 0) +
        parseFloat(cs.marginBottom || 0)
    );
    if (!alto || alto < 120) return;  // todavia cargando

    // Tolerancia de 2 px: fijar el alto cambia el layout, que puede cambiar el
    // alto, que volveria a disparar el observer.
    if (Math.abs(parseInt(f.style.height, 10) - alto) < 2) return;
    f.style.height = alto + 'px';
}

// tema.js escribe `data-tema` en el <html> de cada documento por separado, y
// un iframe solo lo lee al cargar: hay que copiarlo a los que estan abiertos.
function sincronizarTema(f) {
    var d;
    try { d = f.contentDocument; } catch (e) { return; }
    if (!d) return;
    var t = document.documentElement.getAttribute('data-tema');
    if (t) d.documentElement.setAttribute('data-tema', t);
    else d.documentElement.removeAttribute('data-tema');
}

new MutationObserver(function () {
    Object.keys(montados).forEach(function (id) { sincronizarTema(montados[id]); });
}).observe(document.documentElement, { attributes: true, attributeFilter: ['data-tema'] });

// UNA abierta por vez, en todo el tablero. `alUsuario` es cuando la eligio
// alguien con el mouse: ahi, si la pagina estaba scrolleada, vuelve arriba
// ---la herramienta nueva empieza arriba, y abrirla sin que se vea que paso
// algo era uno de los problemas del tablero viejo--- y en pantalla chica se
// cierra el menu.
function activar(id, moverFoco, alUsuario) {
    var h = HERRAMIENTAS.filter(function (x) { return x.id === id; })[0];
    if (!h) return;

    if (activa !== id) {
        activa = id;
        HERRAMIENTAS.forEach(function (x) {
            var tab = document.getElementById('tab-' + x.id);
            var panel = document.getElementById('panel-' + x.id);
            var sel = x.id === id;
            tab.setAttribute('aria-selected', sel ? 'true' : 'false');
            tab.tabIndex = sel ? 0 : -1;
            panel.classList.toggle('activo', sel);
        });

        montar(h);
        // Un iframe con display:none mide 0: al volver, el contenido pudo
        // crecer mientras estaba oculto.
        setTimeout(function () { if (montados[id]) ajustarAlto(montados[id]); }, 60);

        document.getElementById('menuActual').textContent = h.rotulo;
        if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
        document.title = h.rotulo + ' · Tablero de herramientas';
    }

    if (alUsuario) {
        cerrarMenu();
        if (window.scrollY > 0) window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    if (moverFoco && !esPantallaChica()) document.getElementById('tab-' + id).focus();
}

// Numeros para saltar directo, solo entre los plazos. Se ignoran si el foco
// esta escribiendo, que adentro de un iframe pasa siempre.
function atajoNumerico(e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    if (t && t.isContentEditable) return;
    var n = parseInt(e.key, 10);
    if (!n) return;
    var destino = HERRAMIENTAS.filter(function (x) { return x.atajo === n; })[0];
    if (destino) activar(destino.id, true, false);
}

document.addEventListener('keydown', atajoNumerico);

window.addEventListener('hashchange', function () {
    var id = location.hash.slice(1);
    if (HERRAMIENTAS.some(function (x) { return x.id === id; })) activar(id, false, false);
});

// --------------------------------------------------------- el menu en celular
function esPantallaChica() {
    return window.matchMedia('(max-width: 900px)').matches;
}

function cerrarMenu() {
    document.getElementById('lateral').classList.remove('abierto');
    document.getElementById('abrirMenu').setAttribute('aria-expanded', 'false');
}

document.getElementById('abrirMenu').addEventListener('click', function () {
    var lat = document.getElementById('lateral');
    var abierto = lat.classList.toggle('abierto');
    this.setAttribute('aria-expanded', abierto ? 'true' : 'false');
});

document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') cerrarMenu();
});

document.addEventListener('pointerdown', function (e) {
    if (!document.getElementById('lateral').contains(e.target)) cerrarMenu();
});

// El interruptor de tema, al pie del menu. tema.js lo agrega en
// DOMContentLoaded; este oyente se registra despues, asi que corre despues.
document.addEventListener('DOMContentLoaded', function () {
    var b = document.querySelector('body > .tema-boton');
    if (!b) return;
    b.classList.add('en-lateral');
    document.getElementById('lugarTema').appendChild(b);
});

// ---------------------------------------------------------------------------
// La franja de arriba: la fecha de hoy, los dos valores y el calendario.
//
// Nada de esto calcula un plazo: el calendario se carga aca solo para saber si
// HOY cuenta y hasta que año hay datos. El computo de cada calculadora sigue
// pasando adentro de su propio marco.
// ---------------------------------------------------------------------------
var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
             'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

function pesos(n) {
    return '$' + n.toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function mesAnio(iso) {
    var p = iso.split('-');
    return MESES[parseInt(p[1], 10) - 1] + ' ' + p[0];
}

function nota(caja, texto, clase) {
    var n = document.createElement('span');
    n.className = 'n' + (clase ? ' ' + clase : '');
    n.textContent = texto;
    caja.appendChild(n);
}

// La fecha se escribe DOS veces a proposito: sola apenas carga la pagina, y
// otra vez con el habil/inhabil cuando llego el calendario.
function pintarHoy(hayCalendario) {
    var caja = document.getElementById('dato-hoy');
    var hoy = new Date();
    hoy.setHours(0, 0, 0, 0);

    caja.textContent = DIAS[hoy.getDay()] + ' ' + hoy.getDate() + ' de ' +
                       MESES[hoy.getMonth()] + ' de ' + hoy.getFullYear();

    if (!hayCalendario) return;

    if (CalendarioJudicial.esDiaHabil(hoy)) {
        nota(caja, 'día hábil');
    } else {
        var motivo = CalendarioJudicial.obtenerMotivoInhabil(hoy);
        nota(caja, 'no cuenta' + (motivo ? ' · ' + motivo.toLowerCase() : ''), 'no-cuenta');
    }
}

// Los dos valores salen de las mismas series versionadas que publica
// uma-uhom.html. Si una no carga, ese dato dice que no se pudo leer y no
// inventa: un valor de unidad equivocado se propaga a toda una regulacion.
function pintarUnidad(id, url, etiquetaCampo) {
    var caja = document.getElementById(id);
    fetch(url).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    }).then(function (archivo) {
        var serie = archivo.valores;
        if (!serie || !serie.length) throw new Error('serie vacía');
        var hoy = new Date().toISOString().slice(0, 10);
        var v = null;
        for (var i = 0; i < serie.length; i++) {
            if (serie[i].vigencia <= hoy) v = serie[i];
        }
        if (!v) throw new Error('sin valor vigente');
        caja.textContent = pesos(v.valor);
        nota(caja, 'rige desde ' + mesAnio(v.vigencia));
    }).catch(function () {
        caja.textContent = '—';
        nota(caja, 'no se pudo leer ' + etiquetaCampo, 'falta');
    });
}

(function portada() {
    pintarHoy(false);
    pintarUnidad('dato-uma', '../data/serie-uma.json', 'la serie de la UMA');
    pintarUnidad('dato-uhom', '../data/serie-uhom.json', 'la serie del UHOM');

    var cal = document.getElementById('dato-calendario');
    var desde = 2021;
    var hasta = new Date().getFullYear() + 1;
    var anios = [];
    for (var y = desde; y <= hasta; y++) anios.push(y);

    // Hasta el 21/10 era una oracion entera debajo de la franja, siempre a la
    // vista. Ahora es un dato mas de la franja: el rango, y lo que falta en
    // una nota corta. El aviso que FRENA un numero ---el plazo que toca una
    // feria sin Acordada--- sigue saliendo adentro de cada calculadora, al
    // lado del resultado, que es donde importa.
    CalendarioJudicial.init(anios).then(function (r) {
        if (!r.dataLoaded) {
            cal.textContent = '—';
            nota(cal, r.missingYears && r.missingYears.length
                ? 'faltan los feriados de ' + r.missingYears.join(', ') + ': no se puede calcular'
                : 'no se pudieron cargar los feriados: no se puede calcular', 'falta');
            return;
        }
        pintarHoy(true);

        var sinFeria = r.missingFeriaYears || [];
        cal.textContent = desde + '–' + hasta;
        if (sinFeria.length) {
            nota(cal, 'sin la feria de invierno de ' + sinFeria.join(', ') + ': falta la Acordada');
        }
    }).catch(function () {
        cal.textContent = '—';
        nota(cal, 'no se pudo cargar: no se puede calcular', 'falta');
    });
})();

construir();

// El enlace directo manda, venga del grupo que venga: #tasa abre la tasa. Un
// hash que no es ninguna herramienta abre la de siempre.
var inicial = location.hash.slice(1);
var apunta = HERRAMIENTAS.filter(function (x) { return x.id === inicial; })[0];
activar(apunta ? apunta.id : HERRAMIENTAS[0].id, false, false);

</script>
